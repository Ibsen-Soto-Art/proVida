[project]
name = "provida"
version = "0.1.0"
description = "Simulador de vida digital inspirado en Avida — proyecto de aprendizaje de evolución digital"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
analisis = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "networkx>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Sin esto, setuptools se confunde con otras carpetas de nivel superior
# (ej. sitio/, usada por el build del sitio estático de la Fase 8) y las
# trata como si fueran paquetes de Python instalables, cuando solo
# provida/ lo es.
include = ["provida*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["provida"]
